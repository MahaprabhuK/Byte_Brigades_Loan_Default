# Render Blueprint: free Docker web service for the dashboard + API.
# One click: https://render.com/deploy?repo=https://github.com/MahaprabhuK/Byte_Brigades_Loan_Default
services:
  - type: web
    name: loan-default-studio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: WARMUP
        value: "0"
